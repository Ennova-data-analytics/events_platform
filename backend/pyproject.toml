[tool.poetry]
name = "ennova-events-backend"
version = "0.1.0"
description = "The FastAPI backend for the Ennova Events Management Platform."
authors = ["Alan Fijał alan.fijal@gmail.com"]
readme = "README.md"
packages = [{include = "api"}, {include = "core"}, {include = "domain"}, {include = "db"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14" 

fastapi = ">=0.111,<0.163"
uvicorn = {extras = ["standard"], version = ">=0.29,<0.55"}

sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9" # Binary version for easy installation
alembic = "^1.13.1"

bcrypt = "^4.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

python-dotenv = "^1.0.1"
pydantic-settings = "^2.2.1"

email-validator = "^2.1.1"

boto3 = "^1.34.113"

python-multipart = ">=0.0.9,<0.0.33"

stripe = "^7.0.0"
resend = "^2.16.0"
qrcode = {version = "8.2", extras = ["pil"]}
pillow = "^12.3.0"
rembg = "^2.0.50"
onnxruntime = "^1.16.0"
jinja2 = "^3.1.0"

langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-core = "^0.3.0"
openai = "^1.54.0"
markdown = "^3.7"

pandas = "^2.2.0"
openpyxl = "^3.1.0"

sentence-transformers = "^3.3.0"

qdrant-client = "^1.7.0"
python-docx = "^1.1.0"
langchain-text-splitters = "^0.3.0"

icalendar = "^6.3.2"
reportlab = "^4.4.10"

pypdf = "^5.1.0"
apscheduler = "^3.11.0"

# Pulled in by sentence-transformers. Pinned to PyTorch's CPU-only index: the
# default Linux wheel bundles CUDA (~15 nvidia-* packages, several GB) that the
# GPU-less VPS never uses but still has to store and load on every start.
# That index has no macOS wheels, so local Mac installs keep the PyPI build.
torch = [
    {version = "2.9.1", source = "pytorch-cpu", markers = "sys_platform == 'linux'"},
    {version = "2.9.1", markers = "sys_platform != 'linux'"},
]

# Transitive dependencies, listed only to hold them on the major version the
# stack is known to work with (onnxruntime and qdrant-client depend on
# protobuf). The security fixes are available inside these ranges.
protobuf = ">=6.33.5,<7"
filelock = ">=3.20.3,<4"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
# Linters and formatters can be added here in the future
# black = "^24.4.2"
# ruff = "^0.4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
