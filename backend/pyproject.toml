[tool.poetry]
name = "ennova-events-backend"
version = "0.1.0"
description = "The FastAPI backend for the Ennova Events Management Platform."
authors = ["Alan Fijał <your-email@example.com>"]
readme = "README.md"
packages = [{include = "api"}, {include = "core"}, {include = "domain"}, {include = "db"}]

[tool.poetry.dependencies]
python = "^3.11" # Specify the Python version you are developing with

fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}

sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9" # Binary version for easy installation
alembic = "^1.13.1"

bcrypt = "^4.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

python-dotenv = "^1.0.1"
pydantic-settings = "^2.2.1"

email-validator = "^2.1.1"

boto3 = "^1.34.113"

python-multipart = "^0.0.9"

stripe = "^7.0.0"
resend = "^2.16.0"

# AI/LLM Dependencies
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-core = "^0.3.0"
openai = "^1.54.0"
markdown = "^3.7"



[tool.poetry.group.dev.dependencies]
# Linters and formatters can be added here in the future
# black = "^24.4.2"
# ruff = "^0.4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
