version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: ennova-events-db-local
    environment:
      - POSTGRES_USER=ennova_test
      - POSTGRES_PASSWORD=ennova123
      - POSTGRES_DB=ennova_db
    ports:
      - "5432:5432"
    volumes:
      - ennova-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: ennova-events-minio-local
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - ennova-minio-data:/data
    restart: unless-stopped

  # Creates the bucket and sets it to public-read on first run
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ennova-events-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'Waiting for MinIO...'; sleep 2;
        done;
        mc mb --ignore-existing local/ennova-events-platform;
        mc anonymous set download local/ennova-events-platform;
        echo 'Bucket ready.';
      "
    restart: on-failure

volumes:
  ennova-pg-data:
  ennova-minio-data: