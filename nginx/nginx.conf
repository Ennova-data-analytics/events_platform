server {
    listen 80;
    server_name ennova-events.com www.ennova-events.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ennova-events.com www.ennova-events.com;

    ssl_certificate     /etc/letsencrypt/live/ennova-events.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ennova-events.com/privkey.pem;

    client_max_body_size 10M;

    # Compress the frontend's text files (the main JS bundle is ~680 KB raw,
    # ~200 KB gzipped). API responses are left alone: gzip_proxied defaults to
    # off, which also keeps the streamed chat replies unbuffered.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Finnova's finance export is for the server's private network only.
    location /api/internal/ {
        return 404;
    }

    # ADD THIS ENTIRE BLOCK
    # It tells NGINX to forward any URL starting with /api/
    # to your backend container.
    location /api/ {
        # The 'backend' name comes from your docker-compose.yml file


        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append ($proxy_add_x_forwarded_for). uvicorn runs
        # with --forwarded-allow-ips="*" and takes the LEFTMOST entry of this
        # header, so appending would let a client prepend a fake address and
        # choose their own apparent IP - defeating the per-IP rate limits and
        # poisoning the access logs. Setting it to $remote_addr discards
        # anything the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    # Vite puts a content hash in every filename under /assets/, so a changed
    # file always gets a new URL and browsers can keep these forever. A missing
    # asset is a 404 rather than the index.html fallback, so HTML is never
    # cached under a .js URL.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # This existing block serves your frontend application for all other URLs.
    # index.html must be revalidated on every visit so a deploy is picked up
    # straight away (it is what points at the new hashed assets).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------------------------------------------------------------------------
# Finnova (finance.ennova-events.com). Separate app in /root/finnova: its API
# container joins the external "ennova-shared" network as "finnova-api", and
# its static frontend is bind-mounted at /usr/share/nginx/finnova.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name finance.ennova-events.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name finance.ennova-events.com;

    ssl_certificate     /etc/letsencrypt/live/finance.ennova-events.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.ennova-events.com/privkey.pem;

    # Receipts and Excel imports.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Resolve finnova-api through Docker's DNS on each request instead of at
    # startup, so nginx (and the events site) still starts when Finnova is
    # down; Finnova requests then get a 502 instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $finnova_api http://finnova-api:8000;
        # With a variable and no URI part, the original /api/... path is passed on unchanged.
        proxy_pass $finnova_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: see the note in the events-platform /api/ block.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # add_header inside a location replaces the server's headers, so each
    # location repeats the security headers.
    location /assets/ {
        root /usr/share/nginx/finnova;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        root /usr/share/nginx/finnova;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
